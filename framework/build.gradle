    description = 'Runs deterministic offline Open Responses client, protocol and store tests.'
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
    testLogging.showStandardStreams = true; testLogging.showExceptions = true
    maxParallelForks = 1
    doFirst { delete layout.buildDirectory.dir('openresponses-wire') }
    dependsOn cleanTest, jar, 'testLlmResponsesProcessRecovery', 'testLlmResponsesUpgradeVerify', 'testLlmConversationRestartVerify'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/LlmResponsesProtocolTests.class'
    include '**/OpenResponsesWireFixtureTests.class'
    include '**/OpenResponsesLimitsTests.class'
    include '**/OpenResponsesSchemaTests.class'
    include '**/OpenResponsesCoverageTests.class'
    include '**/OpenResponsesReplayContractTests.class'
    include '**/OpenResponsesStreamStateTests.class'
    include '**/OpenResponsesStreamingContractTests.class'
    include '**/LlmResponsesClientIntegrationTests.class'
    include '**/LlmResponsesConversationTests.class'
    include '**/LlmConversationDeleteTests.class'
    include '**/LlmConversationRaceTests.class'
    include '**/LlmConversationWebSocketTests.class'
    include '**/LlmToolLoopContractTests.class'
    include '**/LlmGatewayEventsTests.class'
    include '**/LlmResponsesLiveConversationTests.class'
    include '**/LlmGatewayOpenResponsesTests.class'
    include '**/LlmProviderOperationsTests.class'
    include '**/LlmCompactionTests.class'
    include '**/LlmBackgroundResponseTests.class'
    include '**/LlmConversationUpgradeTests.class'
    include '**/LlmRunStoreTests.class'
    include '**/LlmCleanupRecoveryConcurrencyTests.class'
    include '**/LlmRunExecutionTests.class'
    include '**/SimRunnerTests.class'
    systemProperty 'moqui.runtime', '../runtime'
    systemProperty 'moqui.conf', 'conf/MoquiDevConf.xml'
    systemProperty 'moqui.init.static', 'true'
    if (System.getProperty('openresponses.coverage.write')) systemProperty 'openresponses.coverage.write', System.getProperty('openresponses.coverage.write')
    classpath += files(sourceSets.main.output.classesDirs); classpath += files(projectDir.absolutePath)
    classpath = classpath.filter { it.exists() }
    beforeTest { descriptor -> logger.lifecycle("Running Open Responses test: ${descriptor}") }
}

def openResponsesLibraryRequired = project.hasProperty('openResponsesLibraryRequired') && project.property('openResponsesLibraryRequired') == 'true'
def openResponsesVenvDir = layout.buildDirectory.dir('openresponses-venv').get().asFile
def openResponsesPython = openResponsesLibraryRequired ? new File(openResponsesVenvDir, 'bin/python').absolutePath : 'python3'

tasks.register('prepareOpenResponsesValidator', Exec) {
    group = 'verification'
    description = 'Installs the pinned jsonschema library (tools/openresponses/requirements.txt) in a virtual environment, for the independent check of the schema fixtures. Needs network once.'
    enabled = openResponsesLibraryRequired
    inputs.file file('tools/openresponses/requirements.txt')
    outputs.dir openResponsesVenvDir
    commandLine 'sh', '-c', "python3 -m venv '${openResponsesVenvDir}' && '${openResponsesVenvDir}/bin/pip' install --quiet -r '${file('tools/openresponses/requirements.txt').absolutePath}'"
}

tasks.register('testOpenResponsesSchemaFixtures', Exec) {
    group = 'verification'
    description = 'Validates Moqui Open Responses contract fixtures against the pinned OpenAPI schema snapshot.'
    def reportDir = layout.buildDirectory.dir('reports/openresponses-schema')
    inputs.file file('src/main/resources/org/moqui/impl/llm/openapi-2026-04-24.json')
    inputs.file file('tools/openresponses/validate-schema-fixtures.py')
    outputs.file reportDir.map { it.file('openresponses-schema-fixtures.json') }
    outputs.file reportDir.map { it.file('TEST-openresponses-schema-fixtures.xml') }
    commandLine openResponsesPython,
            file('tools/openresponses/validate-schema-fixtures.py').absolutePath,
            '--schema', file('src/main/resources/org/moqui/impl/llm/openapi-2026-04-24.json').absolutePath,
            '--json-report', reportDir.get().file('openresponses-schema-fixtures.json').asFile.absolutePath,
            '--junit-report', reportDir.get().file('TEST-openresponses-schema-fixtures.xml').asFile.absolutePath
    if (openResponsesLibraryRequired) { dependsOn 'prepareOpenResponsesValidator'; args '--require-library' }
}

tasks.register('testOpenResponsesWireSchema', Exec) {
    group = 'verification'
    description = 'Validates the request bodies the Moqui codec really builds (written by OpenResponsesWireFixtureTests) against the pinned OpenAPI schema, in a separate process.'
    def wireDir = layout.buildDirectory.dir('openresponses-wire')
    def reportDir = layout.buildDirectory.dir('reports/openresponses-wire')
    inputs.file file('src/main/resources/org/moqui/impl/llm/openapi-2026-04-24.json')
    inputs.file file('tools/openresponses/validate-schema-fixtures.py')
    outputs.file reportDir.map { it.file('openresponses-wire.json') }
    commandLine openResponsesPython,
            file('tools/openresponses/validate-schema-fixtures.py').absolutePath,
            '--schema', file('src/main/resources/org/moqui/impl/llm/openapi-2026-04-24.json').absolutePath,
            '--wire-dir', wireDir.get().asFile.absolutePath,
            '--json-report', reportDir.get().file('openresponses-wire.json').asFile.absolutePath,
            '--junit-report', reportDir.get().file('TEST-openresponses-wire.xml').asFile.absolutePath
    if (openResponsesLibraryRequired) { dependsOn 'prepareOpenResponsesValidator'; args '--require-library' }
    doFirst { reportDir.get().asFile.mkdirs() }
    outputs.upToDateWhen { false }
}

tasks.register('testOpenResponsesIndependent') {
    group = 'verification'
    description = 'Optional, needs python3 (and with -PopenResponsesLibraryRequired=true the pinned jsonschema library): checks the schema fixtures and the request bodies the codec builds with another implementation of the schema. Run after testLlmResponsesOffline, which writes the bodies. Not part of the default build.'
    dependsOn 'testOpenResponsesSchemaFixtures', 'testOpenResponsesWireSchema'
}
tasks.named('testOpenResponsesWireSchema') { mustRunAfter 'testLlmResponsesOffline' }

tasks.register('testOpenResponsesProviderCompliance', Exec) {
    group = 'verification'
    description = 'Runs the pinned official Open Responses provider compliance suite when endpoint credentials are configured.'
    def reportDir = layout.buildDirectory.dir('reports/openresponses-compliance')
    inputs.file file('tools/openresponses/compliance-manifest.json')
    inputs.file file('tools/openresponses/run-compliance.py')
    outputs.file reportDir.map { it.file('openresponses-compliance.json') }
    outputs.file reportDir.map { it.file('TEST-openresponses-provider-compliance.xml') }
    commandLine openResponsesPython,
            file('tools/openresponses/run-compliance.py').absolutePath,
            '--manifest', file('tools/openresponses/compliance-manifest.json').absolutePath,
            '--work-dir', layout.buildDirectory.dir('openresponses-compliance').get().asFile.absolutePath,
            '--json-report', reportDir.get().file('openresponses-compliance.json').asFile.absolutePath,
            '--junit-report', reportDir.get().file('TEST-openresponses-provider-compliance.xml').asFile.absolutePath,
            '--timeout-seconds', (findProperty('openResponsesComplianceTimeoutSeconds') ?: '300').toString()
    if (findProperty('openResponsesComplianceRequired') == 'true') args '--required'
    if (findProperty('openResponsesComplianceBaseUrl')) args '--base-url', findProperty('openResponsesComplianceBaseUrl').toString()
    if (findProperty('openResponsesComplianceModel')) args '--model', findProperty('openResponsesComplianceModel').toString()
    if (findProperty('openResponsesComplianceFilter')) args '--filter', findProperty('openResponsesComplianceFilter').toString()
}

def llmRecoveryMarkerFile = layout.buildDirectory.file('tmp/llm-responses-process-recovery/run.json')
def llmCrashToolLedgerFile = file("${System.getProperty('java.io.tmpdir')}/moqui-llm-responses-crash-tool-${project.name}.json")

tasks.register('testLlmResponsesRecoverySeed', Test) {
    group = 'verification'
    description = 'Seeds an Open Responses recoverable run in a separate JVM.'
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
    maxParallelForks = 1
    dependsOn jar
    mustRunAfter 'testOpenResponsesSchemaFixtures'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/LlmRecoveryProcessSeedTests.class'
    systemProperty 'moqui.runtime', '../runtime'
    systemProperty 'moqui.conf', 'conf/MoquiDevConf.xml'
    systemProperty 'moqui.init.static', 'true'
    systemProperty 'llm.recovery.marker', llmRecoveryMarkerFile.get().asFile.absolutePath
    outputs.file llmRecoveryMarkerFile
    classpath += files(sourceSets.main.output.classesDirs); classpath += files(projectDir.absolutePath)
    classpath = classpath.filter { it.exists() }
}

tasks.register('testLlmResponsesRecoveryRecover', Test) {
    group = 'verification'
    description = 'Recovers an Open Responses run seeded by a previous JVM.'
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
    maxParallelForks = 1
    dependsOn 'testLlmResponsesRecoverySeed'
    mustRunAfter 'testLlmResponsesRecoverySeed', 'testOpenResponsesSchemaFixtures'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/LlmRecoveryProcessRecoverTests.class'
    systemProperty 'moqui.runtime', '../runtime'
    systemProperty 'moqui.conf', 'conf/MoquiDevConf.xml'
    systemProperty 'moqui.init.static', 'true'
    systemProperty 'llm.recovery.marker', llmRecoveryMarkerFile.get().asFile.absolutePath
    inputs.file llmRecoveryMarkerFile
    classpath += files(sourceSets.main.output.classesDirs); classpath += files(projectDir.absolutePath)
    classpath = classpath.filter { it.exists() }
}

def llmRestartMarkerFile = layout.buildDirectory.file('tmp/llm-conversation-restart/marker.json')

tasks.register('testLlmConversationRestartSeed', Test) {
