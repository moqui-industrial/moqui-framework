tasks.register('testLlmResponsesProcessRecovery') {
    group = 'verification'
    description = 'Runs Open Responses process recovery checks, including a controlled external-tool crash.'
    dependsOn 'testLlmResponsesRecoveryRecover', 'testLlmResponsesCrashToolRecover'
}

tasks.register('testLlmResponsesCrashToolChild', JavaExec) {
    mustRunAfter 'testLlmConversationRestartSeed', 'testLlmConversationRestartVerify'
    group = 'verification'
    description = 'Runs a child JVM that crashes after an external tool ledger write.'
    dependsOn testClasses, jar
    classpath = sourceSets.test.runtimeClasspath + files(sourceSets.main.output.classesDirs) + files(projectDir.absolutePath)
    mainClass = 'org.moqui.impl.llm.LlmCrashChild'
    args 'fake', llmCrashToolLedgerFile.absolutePath
    systemProperty 'moqui.runtime', '../runtime'
    systemProperty 'moqui.conf', 'conf/MoquiDevConf.xml'
    systemProperty 'moqui.init.static', 'true'
    ignoreExitValue = true
    outputs.file llmCrashToolLedgerFile
    mustRunAfter 'test', 'testLlmResponsesRecoveryRecover', 'testLlmResponsesRecoverySeed'
    doFirst {
        llmCrashToolLedgerFile.parentFile.mkdirs()
        llmCrashToolLedgerFile.delete()
    }
    doLast {
        def exitValue = executionResult.get().exitValue
        if (exitValue != 77) throw new GradleException("Expected LlmCrashChild exit 77, got ${exitValue}")
        if (!llmCrashToolLedgerFile.exists())
            throw new GradleException("Expected crash ledger ${llmCrashToolLedgerFile}")
    }
}

tasks.register('testLlmResponsesCrashToolRecover', Test) {
    mustRunAfter 'testLlmConversationRestartSeed', 'testLlmConversationRestartVerify'
    group = 'verification'
    description = 'Recovers a run whose tool worker crashed after an external effect.'
    useJUnitPlatform()
    testLogging { events "passed", "skipped", "failed" }
    maxParallelForks = 1
    dependsOn 'testLlmResponsesCrashToolChild'
    mustRunAfter 'testLlmResponsesCrashToolChild', 'testLlmResponsesRecoveryRecover', 'testOpenResponsesSchemaFixtures'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/LlmCrashToolRecoverTests.class'
    systemProperty 'moqui.runtime', '../runtime'
    systemProperty 'moqui.conf', 'conf/MoquiDevConf.xml'
    systemProperty 'moqui.init.static', 'true'
    systemProperty 'llm.crash.ledger', llmCrashToolLedgerFile.absolutePath
    inputs.file llmCrashToolLedgerFile
    classpath += files(sourceSets.main.output.classesDirs); classpath += files(projectDir.absolutePath)
    classpath = classpath.filter { it.exists() }
}

jar {
    // this is necessary otherwise jar won't build when war plugin is applied
    enabled = true
    archiveBaseName = 'moqui-framework'
    manifest { attributes 'Implementation-Title': 'Moqui Framework', 'Implementation-Version': version, 'Implementation-Vendor': 'Moqui Ecosystem' }
    from sourceSets.main.output
    // get all of the "resources" that are in component-standard directories instead of src/main/resources
    from fileTree(dir: projectDir.absolutePath, includes: ['data/**', 'entity/**', 'screen/**', 'service/**', 'template/**']) // 'xsd/**'
}

tasks.test {
    inputs.files(tasks.jar)
    mustRunAfter tasks.named('testOpenResponsesProviderCompliance'), tasks.named('testOpenResponsesSchemaFixtures')
    mustRunAfter tasks.named('testLlmResponsesRecoverySeed'), tasks.named('testLlmResponsesRecoveryRecover')
}

war {
    dependsOn jar
    // put the war file in the parent directory, ie the moqui dir instead of the framework dir
    destinationDirectory.set(projectDir.parentFile)
    archiveFileName = 'moqui.war'
    // add MoquiInit.properties to the WEB-INF/classes dir for the deployed war mode of operation
    from(fileTree(dir: projectDir.parentFile, includes: ['MoquiInit.properties'])) { into 'WEB-INF/classes' }
    // this excludes the classes in sourceSets.main.output (better to have the jar file built above)
    classpath = configurations.runtimeClasspath - configurations.providedCompile
    classpath jar.archiveFile.get().asFile

    // put start classes and Jetty jars in the root of the war file for the executable war/jar mode of operation
    from sourceSets.start.output
    from(files(configurations.execWarRuntimeClasspath)) { into 'execlib' }
    // TODO some sort of config for Jetty? from file(projectDir.absolutePath + '/jetty/jetty.xml')
    // setup the manifest for the executable war/jar mode
    manifest { attributes 'Implementation-Title': 'Moqui Start', 'Implementation-Vendor': 'Moqui Ecosystem',
            'Implementation-Version': version, 'Main-Class': 'MoquiStart' }
}

task copyDependencies { doLast {
    delete file(projectDir.absolutePath + '/dependencies')
    copy { from configurations.runtime; into file(projectDir.absolutePath + '/dependencies') }
    copy { from configurations.testCompile; into file(projectDir.absolutePath + '/dependencies') }
} }
